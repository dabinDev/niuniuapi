underscores_in_headers on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream tomato_beinai_app {
    server 127.0.0.1:18089;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tomato.beinai.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tomato.beinai.cc;

    ssl_certificate /etc/nginx/ssl/tomato.beinai.cc/tomato.beinai.cc_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/tomato.beinai.cc/tomato.beinai.cc.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100m;

    access_log /var/log/nginx/tomato.beinai.cc.access.log;
    error_log /var/log/nginx/tomato.beinai.cc.error.log warn;

    location / {
        proxy_pass http://tomato_beinai_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
